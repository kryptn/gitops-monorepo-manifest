[package]
name = "manifest"
version = "0.2.0"
edition = "2021"
repository = "https://github.com/kryptn/gitops-monorepo-manifest"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.75"
clap = { version = "4.5.18", features = ["derive"] }
git2 = { version = "0.19.0", default-features = false, features = ["vendored-openssl", "ssh", "ssh_key_from_memory", "https"] }
glob = "0.3.1"
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.109"
serde_yaml = "0.9.34"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

[dev-dependencies]
rstest = "0.26.1"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu"]
# The installers to generate for each app
installers = ["shell"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Build full artifact pipeline on PRs (without publishing) for release-pipeline verification
pr-run-mode = "upload"
# Sign release artifacts via GitHub Artifact Attestations (Sigstore-backed SLSA provenance)
github-attestations = true
# Sign during the `host` phase (only runs on tag-push releases, not PR builds).
# Default `build-local-artifacts` would try to sign on every PR build, which fails
# on fork PRs because GitHub does not issue an OIDC id-token to forked workflows.
github-attestations-phase = "host"


